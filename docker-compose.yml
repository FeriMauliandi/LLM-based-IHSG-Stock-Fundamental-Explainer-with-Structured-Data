services:
  # ===================================================
  # 1. FastAPI Backend & Web UI
  # Accessible at:
  #   - Swagger Docs: http://localhost:8000/docs
  #   - Web App UI:   http://localhost:8000/app/
  #   - Healthcheck:  http://localhost:8000/health
  # ===================================================
  backend:
    build:
      context: .
      target: backend
    container_name: stock-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-StockAI}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stock-network

  # ===================================================
  # 2. Streamlit Dashboard App
  # Accessible at:
  #   - Dashboard UI: http://localhost:8501
  # ===================================================
  streamlit:
    build:
      context: .
      target: streamlit
    container_name: stock-ai-streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-StockAI}
    env_file:
      - path: .env
        required: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge